name: The Pill Club
description: 'The Pill Club was a US direct-to-consumer telehealth and pharmacy service
  for birth control and reproductive health, delivering prescription contraception and
  sexual-health products by mail. The brand has been consolidated into Nurx (a Thirty
  Madison company): its domain thepillclub.com now 301-redirects to nurx.com. It was
  surfaced as a portfolio company of GV and added to the API Evangelist network for
  enrichment. No public developer, API, or documentation surface was found for either
  the legacy brand or its Nurx successor; this is a consumer healthcare service with
  no external API program.'
